# Fly.io alternative to render.yaml. One image, two process groups.
# Secrets: `fly secrets set DATABASE_URL=... CLERK_SECRET_KEY=...` (never in this file).
# Backups: run as a scheduled machine, see docs/RUNBOOK.md §5.
# ClamAV: a separate private app, see deploy/fly/clamav.toml (CLAMAV_HOST=avixcheck-clamav.internal).
# Releases: .github/workflows/deploy.yml deploys the CI-built image with `fly deploy --image`.
app = "avixcheck"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npm run db:migrate"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  APP_ENV = "production"
  AUTH_PROVIDER = "clerk"
  LOG_LEVEL = "info"
  CLAMAV_PORT = "3310"

[processes]
  web = "npm run start"
  worker = "npm run worker"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpus = 1
  processes = ["web", "worker"]
