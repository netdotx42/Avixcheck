name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL client tools for backup/restore tests
        run: pg_dump --version && pg_restore --version
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations are in sync with schema
        run: npx drizzle-kit check
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_OUTPUT_DIR: /tmp/e2e-results
      E2E_REPORT_DIR: /tmp/e2e-report
      # Real storage and malware scanning for the upload-to-export spec.
      E2E_S3_ENDPOINT: http://localhost:9000
      E2E_S3_REGION: us-east-1
      E2E_S3_BUCKET: avixcheck-e2e
      E2E_S3_ACCESS_KEY_ID: avixminio
      E2E_S3_SECRET_ACCESS_KEY: avixminio-secret
      E2E_S3_FORCE_PATH_STYLE: "true"
      E2E_CLAMAV_HOST: localhost
      E2E_CLAMAV_PORT: "3310"
      # Test-only extractor that replays tests/fixtures/extraction (refused outside APP_ENV=test).
      E2E_EXTRACTION_PROVIDER: fixture
      E2E_REQUIRE_WORKFLOW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start S3-compatible storage and ClamAV
        run: |
          set -x
          # MinIO no longer publishes images on Docker Hub; use its quay.io mirror,
          # falling back to SeaweedFS (also a real S3-compatible server) if that pull fails.
          docker run -d --name s3 -p 9000:9000 -e MINIO_ROOT_USER=avixminio -e MINIO_ROOT_PASSWORD=avixminio-secret \
              quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data \
            || docker run -d --name s3 -p 9000:8333 chrislusf/seaweedfs:3.80 server -s3
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
      - run: npx playwright install --with-deps chromium
      - name: Wait for storage and create the private bucket
        env:
          AWS_ACCESS_KEY_ID: avixminio
          AWS_SECRET_ACCESS_KEY: avixminio-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -x
          for i in $(seq 60); do aws --endpoint-url http://localhost:9000 s3api list-buckets >/dev/null 2>&1 && break; sleep 2; done
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket avixcheck-e2e
          aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket avixcheck-e2e
      - name: Wait for clamd (signature download can take a few minutes)
        run: |
          for i in $(seq 120); do
            if [ "$(printf 'zPING\0' | nc -w 2 localhost 3310 | tr -d '\0')" = "PONG" ]; then echo "clamd ready"; exit 0; fi
            sleep 5
          done
          docker logs clamav | tail -50; exit 1
      - name: Service logs on failure
        if: failure()
        run: docker ps -a; docker logs s3 2>&1 | tail -50; docker logs clamav 2>&1 | tail -50
      - name: Go-live verifier against the real storage, ClamAV and database services
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://avix_verify:avix_verify@localhost:5432/avix_verify
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: avixcheck-e2e
          S3_ACCESS_KEY_ID: avixminio
          S3_SECRET_ACCESS_KEY: avixminio-secret
          S3_FORCE_PATH_STYLE: "true"
          CLAMAV_HOST: localhost
          APP_ENV: staging
        run: |
          psql -h localhost -U postgres -c "create role avix_verify login password 'avix_verify' nosuperuser nobypassrls" -c "create database avix_verify owner avix_verify"
          npm run db:migrate
          npm run ops:verify-live -- --only database,storage,malwareScan --report /tmp/e2e-results/golive-verify.json
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            /tmp/e2e-results
            /tmp/e2e-report

  # Builds the production image and boots it, so a broken Dockerfile fails here
  # instead of on the hosting platform.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --build-arg APP_RELEASE=${{ github.sha }} -t avixcheck:ci .
      - name: Create a non-superuser app role
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "create role avix_app login password 'avix_app' nosuperuser nobypassrls" -c "create database avixcheck owner avix_app"
      - name: Run migrations from the image
        run: docker run --rm --network host -e DATABASE_URL=postgres://avix_app:avix_app@localhost:5432/avixcheck avixcheck:ci npm run db:migrate
      - name: Boot the web process and check health and the setup state
        run: |
          docker run -d --name web --network host -e APP_ENV=staging -e DATABASE_URL=postgres://avix_app:avix_app@localhost:5432/avixcheck avixcheck:ci
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/health -o health.json && break; sleep 2; done
          cat health.json; echo
          # No integrations are configured here, so the app must say so rather than claim to be ready.
          jq -e '.database == "ok" and .status == "degraded" and .release == "${{ github.sha }}"' health.json
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/setup
          curl -sSI http://localhost:3000/sign-in | grep -i "strict-transport-security"
      - name: Ops scripts run inside the image
        run: docker run --rm --network host -e DATABASE_URL=postgres://avix_app:avix_app@localhost:5432/avixcheck avixcheck:ci npm run ops:verify-live -- --only database --report /tmp/verify.json
      - name: Container logs on failure
        if: failure()
        run: docker logs web 2>&1 | tail -100
