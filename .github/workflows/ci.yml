name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL client tools for backup/restore tests
        run: pg_dump --version && pg_restore --version
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations are in sync with schema
        run: npx drizzle-kit check
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_OUTPUT_DIR: ${{ github.workspace }}/../e2e-results
      E2E_REPORT_DIR: ${{ github.workspace }}/../e2e-report
      # Real storage and malware scanning for the upload-to-export spec.
      E2E_S3_ENDPOINT: http://localhost:9000
      E2E_S3_REGION: us-east-1
      E2E_S3_BUCKET: avixcheck-e2e
      E2E_S3_ACCESS_KEY_ID: avixminio
      E2E_S3_SECRET_ACCESS_KEY: avixminio-secret
      E2E_S3_FORCE_PATH_STYLE: "true"
      E2E_CLAMAV_HOST: localhost
      E2E_CLAMAV_PORT: "3310"
      # Test-only extractor that replays tests/fixtures/extraction (refused outside APP_ENV=test).
      E2E_EXTRACTION_PROVIDER: fixture
      E2E_REQUIRE_WORKFLOW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MinIO and ClamAV
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=avixminio -e MINIO_ROOT_PASSWORD=avixminio-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
      - run: npx playwright install --with-deps chromium
      - name: Wait for MinIO and create the private bucket
        run: |
          for i in $(seq 60); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set local http://localhost:9000 avixminio avixminio-secret && mc mb -p local/avixcheck-e2e && mc anonymous set none local/avixcheck-e2e"
      - name: Wait for clamd (signature download can take a few minutes)
        run: |
          for i in $(seq 120); do
            if [ "$(printf 'zPING\0' | nc -w 2 localhost 3310 | tr -d '\0')" = "PONG" ]; then echo "clamd ready"; exit 0; fi
            sleep 5
          done
          docker logs clamav | tail -50; exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ${{ github.workspace }}/../e2e-results
            ${{ github.workspace }}/../e2e-report
