# Local development dependencies. Not for production.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: avix_owner
      POSTGRES_PASSWORD: avix_owner
      POSTGRES_DB: avixcheck
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U avix_owner"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: avixminio, MINIO_ROOT_PASSWORD: avixminio-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 avixminio avixminio-secret &&
      mc mb -p local/avixcheck-dev && mc anonymous set none local/avixcheck-dev"

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

volumes: { pgdata: {}, miniodata: {} }
